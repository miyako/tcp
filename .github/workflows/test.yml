name: Test

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: get tool version
        id: tool
        uses: miyako/4D/.github/actions/tool4d-get-version@v1

      - name: get tool4d
        id: get
        uses: miyako/4D/.github/actions/tool4d-download@v1
        with:
          platform: ${{ runner.os == 'Windows' && 'windows' || steps.tool.outputs.platform }}
          branch: ${{ steps.tool.outputs.branch }}
          version: ${{ steps.tool.outputs.version }}
          build: ${{ steps.tool.outputs.build }}
          arch: ${{ steps.tool.outputs.arch }}

      - name: compile and test
        run: tests/run.sh "${{ steps.get.outputs.tool4d_executable_path }}"
        shell: bash
